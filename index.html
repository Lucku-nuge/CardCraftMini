<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CardCraft Mini</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="card">
        <img
            class="profile-photo"
            src="https://placehold.co/150"
            alt="Profile photo"
        >

        <h1>Lucky Nugegodage Don</h1>
        <h2>Business Administration Student</h2>

        <p>
            I enjoy learning about business, communication, and management.
            My goal is to develop skills that will help me succeed in my future career.
        </p>

        <a class="contact-button" href="mailto:your-email@example.com">
            Contact Me
        </a>

        <div class="social-links">
            <a href="mailto:your-email@example.com" aria-label="Email">✉</a>
            <a href="https://www.linkedin.com/" aria-label="LinkedIn">in</a>
            <a href="https://www.instagram.com/" aria-label="Instagram">◎</a>
        </div>
    </main>
</body>
</html>
